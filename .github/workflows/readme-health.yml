name: README health

# Catches a dead badge or an error card before it sits on the profile for days.
# Runs weekly and on every change to the README or its assets.

on:
  schedule:
    - cron: "41 7 * * 1"      # Mondays, 07:41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - scripts/check_readme.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_readme.py README.md
