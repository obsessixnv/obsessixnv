  <text x="720" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="middle" fill="#8a7350">Jun 22, 2026 — Jul 3, 2026</text>
  <path d="M285 62 V 152" stroke="#b8860b" stroke-width="1" opacity="0.3"/>
  <path d="M575 62 V 152" stroke="#b8860b" stroke-width="1" opacity="0.3"/>
