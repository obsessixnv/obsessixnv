<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Festina lente — Ars longa, vita brevis">
  <title>Festina lente · Ars longa, vita brevis</title>
  <defs>
    <radialGradient id="frescof" cx="50%" cy="120%" r="120%">
      <stop offset="0%"  stop-color="#f5e7c5"/>
      <stop offset="100%" stop-color="#d2b478"/>
    </radialGradient>
    <linearGradient id="goldf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d98a"/>
      <stop offset="45%" stop-color="#c0901a"/>
      <stop offset="100%" stop-color="#7c5108"/>
    </linearGradient>
    <filter id="grainf">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>

  <style>
    .lat { font-family: Georgia, "Times New Roman", serif; fill: #9c6a12; font-weight: 700; }
    .breathe { transform-box: fill-box; transform-origin: center; animation: br 6s ease-in-out infinite; }
    @keyframes br { 0%,100% { transform: scale(1);} 50% { transform: scale(1.12);} }
  </style>

  <rect width="1200" height="150" fill="url(#frescof)"/>
  <rect width="1200" height="150" filter="url(#grainf)" opacity="0.6"/>

  <!-- gilded molding rail (foot of the frame) -->
  <rect x="34" y="22" width="1132" height="9" fill="url(#goldf)"/>
  <rect x="34" y="22" width="1132" height="2" fill="#f3e3a6" opacity="0.7"/>
  <rect x="34" y="33" width="1132" height="2" fill="#6b4a18"/>
  <line x1="42" y1="40" x2="1158" y2="40" stroke="#b8860b" stroke-width="2" stroke-dasharray="1.5 5" opacity="0.85"/>

  <!-- small gilt fleuron -->
  <g transform="translate(600,57)">
    <g class="breathe" fill="url(#goldf)">
      <rect x="-3.6" y="-3.6" width="7.2" height="7.2" transform="rotate(45)"/>
      <circle cx="-14" cy="0" r="2.4"/><circle cx="14" cy="0" r="2.4"/>
      <rect x="-1.7" y="-1.7" width="3.4" height="3.4" fill="#6b4a18" transform="rotate(45)"/>
    </g>
  </g>

  <!-- mottos -->
  <text class="lat" x="600" y="99" text-anchor="middle" font-size="26" letter-spacing="7">FESTINA LENTE</text>
  <text class="lat" x="600" y="121" text-anchor="middle" font-size="12" letter-spacing="5" fill="#6b4423">ARS &#183; LONGA &#183; VITA &#183; BREVIS</text>
</svg>
