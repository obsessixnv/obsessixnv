  <text x="140" y="102" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" text-anchor="middle" fill="#2b1e08">1.8k</text>
  <text x="140" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="1.6" text-anchor="middle" fill="#8a6a1e">Total Contributions</text>
  <text x="140" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="middle" fill="#8d7b52">Oct 22, 2023 — Present</text>
  <circle cx="430" cy="98" r="46" fill="none" stroke="#8a6a1e" stroke-width="4" opacity="0.25"/>
