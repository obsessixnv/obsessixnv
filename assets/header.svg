<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Roman Yankovych — Forward Deployed Engineer at Elcano">
  <title>Roman Yankovych — Forward Deployed Engineer at Elcano · Plus Ultra</title>

  <defs>
    <radialGradient id="parch" cx="38%" cy="42%" r="85%">
      <stop offset="0%"  stop-color="#f7ebcf"/>
      <stop offset="55%" stop-color="#efdcb2"/>
      <stop offset="100%" stop-color="#e0c690"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e6c569"/>
      <stop offset="45%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8a5a0a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="62%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5a3d10" stop-opacity="0.30"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <style>
    .ttl  { font-family: Georgia, "Times New Roman", serif; fill: #3a2a14; }
    .name { font-size: 58px; font-weight: 700; letter-spacing: 1px; }
    .sub  { font-size: 16px; font-weight: 700; letter-spacing: 7px; fill: #6b4423; }
    .motto{ font-size: 15px; font-weight: 700; letter-spacing: 9px; fill: #9c6a12; }
    .fade { animation: fade 1.8s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .bob  { transform-box: fill-box; transform-origin: center; animation: bob 4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg);} 50% { transform: translateY(-6px) rotate(2deg);} }
    .ship { animation: sail 34s linear infinite; }
    @keyframes sail { from { transform: translateX(-90px);} to { transform: translateX(1290px);} }
    .w1 { animation: d1 13s linear infinite; }
    .w2 { animation: d2 9s  linear infinite; }
    @keyframes d1 { from { transform: translateX(0);} to { transform: translateX(-400px);} }
    @keyframes d2 { from { transform: translateX(-500px);} to { transform: translateX(0);} }
  </style>

  <!-- parchment -->
  <rect width="1200" height="300" fill="url(#parch)"/>
  <rect width="1200" height="300" filter="url(#grain)" opacity="0.5"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- manuscript border -->
  <rect x="16" y="16" width="1168" height="268" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="23" y="23" width="1154" height="254" fill="none" stroke="#b8860b" stroke-width="1" opacity="0.55"/>
  <g fill="url(#gold)">
    <rect x="11" y="11" width="10" height="10" transform="rotate(45 16 16)"/>
    <rect x="1179" y="11" width="10" height="10" transform="rotate(45 1184 16)"/>
    <rect x="11" y="279" width="10" height="10" transform="rotate(45 16 284)"/>
    <rect x="1179" y="279" width="10" height="10" transform="rotate(45 1184 284)"/>
  </g>

  <!-- rotating compass rose / astrolabe -->
  <g transform="translate(232,150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
      <circle r="112" fill="none" stroke="url(#gold)" stroke-width="1"/>
      <circle r="108" fill="none" stroke="#b8860b" stroke-width="6" stroke-dasharray="1.4 11.2" opacity="0.7"/>
      <circle r="94"  fill="none" stroke="url(#gold)" stroke-width="1.3"/>
      <circle r="56"  fill="none" stroke="#b8860b" stroke-width="0.8" opacity="0.55"/>
      <!-- principal spikes (bicolour) -->
      <g>
        <path d="M0 0 L0 -94 L-13 -13 Z" fill="#9c6a12"/><path d="M0 0 L0 -94 L13 -13 Z" fill="#e6c569"/>
        <path d="M0 0 L0 94 L13 13 Z"   fill="#9c6a12"/><path d="M0 0 L0 94 L-13 13 Z"  fill="#e6c569"/>
        <path d="M0 0 L94 0 L13 13 Z"   fill="#9c6a12"/><path d="M0 0 L94 0 L13 -13 Z"  fill="#e6c569"/>
        <path d="M0 0 L-94 0 L-13 -13 Z" fill="#9c6a12"/><path d="M0 0 L-94 0 L-13 13 Z" fill="#e6c569"/>
      </g>
      <!-- intercardinal spikes -->
      <g opacity="0.95">
        <path d="M0 0 L48 -48 L4 -12 Z" fill="#b8860b"/><path d="M0 0 L48 -48 L12 -4 Z" fill="#cf9c2e"/>
        <path d="M0 0 L-48 -48 L-12 -4 Z" fill="#b8860b"/><path d="M0 0 L-48 -48 L-4 -12 Z" fill="#cf9c2e"/>
        <path d="M0 0 L48 48 L12 4 Z" fill="#b8860b"/><path d="M0 0 L48 48 L4 12 Z" fill="#cf9c2e"/>
        <path d="M0 0 L-48 48 L-4 12 Z" fill="#b8860b"/><path d="M0 0 L-48 48 L-12 4 Z" fill="#cf9c2e"/>
      </g>
      <circle r="7" fill="url(#gold)"/>
      <circle r="2.4" fill="#3a2a14"/>
    </g>
  </g>

  <!-- name block -->
  <g class="fade">
    <text class="ttl motto" x="432" y="74">✦ &#160; P L V S &#160; V L T R A &#160; ✦</text>
    <text class="ttl name"  x="430" y="158">Roman Yankovych</text>
    <text class="ttl sub"   x="432" y="196">FORWARD DEPLOYED ENGINEER &#183; ELCANO</text>
  </g>

  <!-- the Victoria, sailing -->
  <g transform="translate(0,258)">
    <g class="ship">
      <g class="bob">
        <rect x="-1" y="-52" width="2.4" height="52" fill="#4a3416"/>
        <path d="M1 -48 Q 31 -34 26 -6 L 1 -6 Z" fill="#f3e4c1"/>
        <path d="M-2 -42 Q -27 -30 -22 -8 L -2 -8 Z" fill="#e7d4ab"/>
        <g fill="#9c3b2e"><rect x="9" y="-34" width="9" height="2.4"/><rect x="12.3" y="-39" width="2.4" height="11"/></g>
        <path d="M1 -52 L 19 -47 L 1 -42 Z" fill="#b8860b"/>
        <path d="M-36 0 L 36 0 L 25 15 L -25 15 Z" fill="#4a3416"/>
        <text x="0" y="11" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="700" letter-spacing="1.6" fill="#f3e4c1">VICTORIA</text>
      </g>
    </g>
  </g>

  <!-- ink waves -->
  <g class="w1" opacity="0.30">
    <path fill="none" stroke="#6b4423" stroke-width="2" d="M0 280 Q 100 270 200 280 T 400 280 T 600 280 T 800 280 T 1000 280 T 1200 280 T 1400 280 T 1600 280"/>
  </g>
  <g class="w2" opacity="0.45">
    <path fill="none" stroke="#8a5a0a" stroke-width="2" d="M0 288 Q 125 279 250 288 T 500 288 T 750 288 T 1000 288 T 1250 288 T 1500 288 T 1750 288"/>
  </g>
</svg>
