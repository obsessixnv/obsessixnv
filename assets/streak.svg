<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" role="img" aria-label="the reckoning">
  <title>the reckoning</title>
  <defs>
    <radialGradient id="gk" cx="28%" cy="22%" r="92%">
      <stop offset="0%" stop-color="#2a1e11"/><stop offset="60%" stop-color="#14100a"/>
      <stop offset="100%" stop-color="#0b0807"/>
    </radialGradient>
    <linearGradient id="bk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7c469"/><stop offset="55%" stop-color="#8a6a1e"/>
      <stop offset="100%" stop-color="#3d2b09"/>
    </linearGradient>
  </defs>
  <rect width="860" height="200" rx="7" fill="url(#gk)"/>
  <rect x="1.1" y="1.1" width="857.8" height="197.8" rx="6" fill="none"
