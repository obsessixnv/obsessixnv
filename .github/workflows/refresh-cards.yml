name: Refresh Codex cards

# Redraws assets/{stats,langs,streak,activity}.svg from the GitHub API and
# commits them when they change. The README points at those files, so it never
# depends on a third-party card service staying up.

on:
  schedule:
    - cron: "17 3 * * *"      # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_cards.py
      - scripts/render_banners.py
      - scripts/palette.py
      - .github/workflows/refresh-cards.yml

concurrency:
  group: refresh-cards
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        env:
          # secrets are readable in a step's env, but not in its `if:` condition.
          # METRICS_TOKEN is optional: GITHUB_TOKEN already returns private
          # *contributions* for the repository owner (measured — commit totals
          # match a full PAT exactly). It only narrows the repository count to
          # repos the token can see, so a PAT is an accuracy nicety, not a
          # requirement, and its absence must never block the daily refresh.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.METRICS_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::notice::Running with GITHUB_TOKEN. Contribution figures are complete; the repository count covers public repos only. Add a classic PAT with the read:user scope as the METRICS_TOKEN secret to include private repositories."
          fi
          python3 scripts/render_cards.py --user "${{ github.repository_owner }}"

      - name: Render banners
        # deterministic, so this is a no-op unless the palette or template moved
        run: python3 scripts/render_banners.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Refresh Codex cards"
          git push
