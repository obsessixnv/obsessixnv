<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Roman Yankovych — Forward Deployed Engineer at Elcano">
  <title>Roman Yankovych — Forward Deployed Engineer at Elcano · Ostinato Rigore</title>

  <defs>
    <radialGradient id="fresco" cx="38%" cy="36%" r="92%">
      <stop offset="0%"  stop-color="#f7eccf"/>
      <stop offset="50%" stop-color="#ecd8ac"/>
      <stop offset="100%" stop-color="#d2b478"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f0d98a"/>
      <stop offset="40%" stop-color="#c0901a"/>
      <stop offset="100%" stop-color="#7c5108"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="76%">
      <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5a3d10" stop-opacity="0.34"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
    <!-- classical palmette (anthemion) crest -->
    <g id="palmette" fill="url(#gold)">
      <path d="M0 0 Q -5 -13 0 -25 Q 5 -13 0 0 Z"/>
      <path d="M0 0 Q -12 -11 -11 -21 Q -3 -12 0 0 Z"/>
      <path d="M0 0 Q 12 -11 11 -21 Q 3 -12 0 0 Z"/>
      <path d="M0 0 Q -20 -6 -18 -15 Q -7 -9 0 0 Z"/>
      <path d="M0 0 Q 20 -6 18 -15 Q 7 -9 0 0 Z"/>
      <path d="M-15 2 Q -22 2 -20 -5" fill="none" stroke="url(#gold)" stroke-width="1.4"/>
      <path d="M15 2 Q 22 2 20 -5" fill="none" stroke="url(#gold)" stroke-width="1.4"/>
      <circle r="2.6"/>
    </g>
  </defs>

  <style>
    .ttl  { font-family: Georgia, "Times New Roman", serif; fill: #3a2a14; }
    .name { font-size: 56px; font-weight: 700; letter-spacing: 1px; }
    .sub  { font-size: 15px; font-weight: 700; letter-spacing: 6.5px; fill: #6b4423; }
    .motto{ font-size: 14px; font-weight: 700; letter-spacing: 8px; fill: #9c6a12; }
    .fade { animation: fade 1.9s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .draw { animation: draw 2.6s ease-out both; }
    @keyframes draw { from { opacity: 0;} to { opacity: 1;} }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: 1;} 50% { opacity: 0.62;} }
  </style>

  <!-- fresco ground -->
  <rect width="1200" height="300" fill="url(#fresco)"/>
  <rect width="1200" height="300" filter="url(#grain)" opacity="0.6"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- carved gilded picture frame -->
  <rect x="3"  y="3"  width="1194" height="294" fill="none" stroke="#7c5108" stroke-width="2"/>
  <rect x="9"  y="9"  width="1182" height="282" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <rect x="9"  y="9"  width="1182" height="282" fill="none" stroke="#f3e3a6" stroke-width="1.3" opacity="0.7"/>
  <rect x="17" y="17" width="1166" height="266" fill="none" stroke="#6b4a18" stroke-width="1.6"/>
  <rect x="22" y="22" width="1156" height="256" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="1.5 5" opacity="0.85"/>
  <use href="#palmette" x="600" y="40"/>
  <use href="#palmette" x="600" y="260" transform="rotate(180 600 260)"/>

  <!-- Vitruvian study -->
  <g class="draw" transform="translate(228,150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="120s" repeatCount="indefinite"/>
      <circle r="105" fill="none" stroke="#b8860b" stroke-width="4" stroke-dasharray="1.2 12" opacity="0.45"/>
    </g>
    <circle class="glow" r="95" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <rect x="-75" y="-66" width="150" height="150" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.9"/>
    <g stroke="#5a4022" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-55" r="11"/>
      <path d="M0 -44 L0 14"/>
      <path d="M-17 -40 Q0 -46 17 -40"/>
      <path d="M-12 14 Q0 10 12 14"/>
      <path d="M-13 -40 Q-18 -14 -10 14"/>
      <path d="M13 -40 Q18 -14 10 14"/>
      <path d="M-17 -40 L-86 -40"/><path d="M17 -40 L86 -40"/>
      <path d="M-17 -40 L-58 -74"/><path d="M17 -40 L58 -74"/>
      <path d="M-7 14 L-12 82"/><path d="M7 14 L12 82"/>
      <path d="M-7 14 L-61 73"/><path d="M7 14 L61 73"/>
    </g>
    <g fill="#5a4022">
      <circle cx="-86" cy="-40" r="2.8"/><circle cx="86" cy="-40" r="2.8"/>
      <circle cx="-58" cy="-74" r="2.8"/><circle cx="58" cy="-74" r="2.8"/>
      <ellipse cx="-12" cy="84" rx="5" ry="2.4"/><ellipse cx="12" cy="84" rx="5" ry="2.4"/>
      <ellipse cx="-61" cy="75" rx="5" ry="2.4" transform="rotate(40 -61 75)"/>
      <ellipse cx="61" cy="75" rx="5" ry="2.4" transform="rotate(-40 61 75)"/>
    </g>
    <circle r="2.6" fill="url(#gold)"/>
  </g>

  <!-- name block -->
  <g class="fade">
    <text class="ttl motto" x="430" y="78">✦ &#160; O S T I N A T O &#160; R I G O R E &#160; ✦</text>
    <text class="ttl name"  x="428" y="160">Roman Yankovych</text>
    <text class="ttl sub"   x="430" y="196">FORWARD DEPLOYED ENGINEER &#183; ELCANO</text>
  </g>
</svg>
