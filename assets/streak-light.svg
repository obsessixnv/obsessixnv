      <stop offset="0%" stop-color="#fdf8ea"/><stop offset="60%" stop-color="#f3e9d2"/>
      <stop offset="100%" stop-color="#e6d8b8"/>
    </radialGradient>
    <linearGradient id="bk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9992a"/><stop offset="55%" stop-color="#9a7a26"/>
      <stop offset="100%" stop-color="#5c4109"/>
    </linearGradient>
  </defs>
  <rect width="860" height="200" rx="7" fill="url(#gk)"/>
  <rect x="1.1" y="1.1" width="857.8" height="197.8" rx="6" fill="none"
