<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Roman Yankovych — Forward Deployed Engineer at Elcano · Ostinato Rigore">
  <title>Roman Yankovych — Forward Deployed Engineer at Elcano · Ostinato Rigore</title>

  <defs>
    <radialGradient id="night" cx="30%" cy="34%" r="98%">
      <stop offset="0%"  stop-color="#fdf8ea"/>
      <stop offset="42%" stop-color="#f3e9d2"/>
      <stop offset="100%" stop-color="#e2d3b0"/>
    </radialGradient>
    <radialGradient id="candle" cx="30%" cy="32%" r="72%">
      <stop offset="0%"  stop-color="#fff3cf" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f8ecd0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f8ecd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#d9a72f"/>
      <stop offset="38%" stop-color="#a8781c"/>
      <stop offset="72%" stop-color="#7a5610"/>
      <stop offset="100%" stop-color="#4a3408"/>
    </linearGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#c9992a"/>
      <stop offset="60%" stop-color="#96701c"/>
      <stop offset="100%" stop-color="#5c4109"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="40%" stop-color="#8a6a3a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8a6a3a" stop-opacity="0.26"/>
    </radialGradient>
    <linearGradient id="leafg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8412a"/>
      <stop offset="55%" stop-color="#79271a"/>
      <stop offset="100%" stop-color="#401410"/>
    </linearGradient>
    <linearGradient id="budg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a23c28"/>
      <stop offset="100%" stop-color="#5c1c14"/>
    </linearGradient>
    <radialGradient id="berryg" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#7a241a"/>
      <stop offset="100%" stop-color="#250a08"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>

    <!-- a single dried leaf, base at 0,0 pointing +x -->
    <g id="leaf">
      <path d="M0 0 C 13 -10 38 -8 47 0 C 38 8 13 10 0 0 Z" fill="url(#leafg)"/>
      <path d="M4 0 Q 26 1 45 0" fill="none" stroke="#360f0b" stroke-width="0.9"/>
      <path d="M14 -1 l 6 -5 M24 -1 l 7 -5 M14 1 l 6 5 M24 1 l 7 5" stroke="#360f0b" stroke-width="0.7" opacity="0.7"/>
      <path d="M0 0 C 13 -10 38 -8 47 0" fill="none" stroke="#8a5a1e" stroke-width="0.8" opacity="0.45"/>
    </g>
    <!-- nodding rosebud, base at 0,0 -->
    <g id="bud">
      <path d="M0 9 C -11 4 -10 -13 0 -17 C 10 -13 11 4 0 9 Z" fill="url(#budg)"/>
      <path d="M0 -15 C -5 -6 -4 3 0 7" fill="none" stroke="#3a120d" stroke-width="0.9" opacity="0.8"/>
      <path d="M-6 -9 C -4 -2 -3 4 0 7" fill="none" stroke="#3a120d" stroke-width="0.8" opacity="0.7"/>
      <path d="M6 -9 C 4 -2 3 4 0 7" fill="none" stroke="#3a120d" stroke-width="0.8" opacity="0.7"/>
      <path d="M0 -17 C -4 -10 -3 -4 0 0" fill="none" stroke="#8a5a1e" stroke-width="0.8" opacity="0.4"/>
      <path d="M-2 8 C -9 14 -13 12 -15 6 M2 8 C 9 14 13 12 15 6" fill="none" stroke="#5a2a16" stroke-width="1.4"/>
    </g>
    <g id="berry">
      <circle r="4.2" fill="url(#berryg)"/>
      <circle cx="-1.3" cy="-1.4" r="1.1" fill="#e8c98a" opacity="0.55"/>
    </g>

    <!-- carved molding fleuron, right half: scroll sweeping outward, curling inward -->
    <g id="fleuronHalf">
      <path d="M5 0 C 20 -1 34 -4 44 0 C 52 4 50 12 43 12 C 37 12 35 5 41 4"
            fill="none" stroke="url(#gilt)" stroke-width="2.4" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(15,-1) rotate(12) scale(0.5)"/>
      <circle cx="27" cy="4.4" r="1.5" fill="#8a5a1e" opacity="0.7"/>
      <path d="M56 0 L 132 0" stroke="#8a6a1e" stroke-width="1.4" opacity="0.75"/>
      <path d="M140 0 l 4.4 -3.4 l 4.4 3.4 l -4.4 3.4 Z" fill="#9a7520" opacity="0.85"/>
    </g>
    <!-- full fleuron: mirrored scrolls about a central bud pointing inward (+y) -->
    <g id="fleuron">
      <use href="#fleuronHalf"/>
      <use href="#fleuronHalf" transform="scale(-1,1)"/>
      <path d="M0 -4 C -6.5 0 -6.5 9 0 14.5 C 6.5 9 6.5 0 0 -4 Z" fill="url(#budg)"/>
      <path d="M0 12.5 C -2 7 -2 2 0 -2.5" fill="none" stroke="#3a120d" stroke-width="0.8" opacity="0.75"/>
      <path d="M0 -4 C 3.5 0.5 3.5 6 1.5 10" fill="none" stroke="#8a5a1e" stroke-width="0.7" opacity="0.45"/>
    </g>
  </defs>

  <style>
    .fade  { animation: fade 1.1s ease-out both; }
    .fade2 { animation: fade 1.1s ease-out 0.22s both; }
    .fade3 { animation: fade 1.1s ease-out 0.44s both; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    .flick { animation: flick 5.5s ease-in-out infinite; }
    @keyframes flick { 0%{opacity:.82} 22%{opacity:1} 38%{opacity:.78} 55%{opacity:.96} 74%{opacity:.8} 100%{opacity:.9} }
    @media (prefers-reduced-motion: reduce) {
      .fade, .fade2, .fade3, .flick { animation: none }
    }
  </style>

  <!-- ground -->
  <rect width="1200" height="300" fill="url(#night)"/>
  <rect class="flick" width="1200" height="300" fill="url(#candle)"/>
  <rect width="1200" height="300" filter="url(#grain)" opacity="0.30"/>

  <!-- dried botanical: leaves seated on the stem, cascading down the left -->
  <g>
    <path d="M88 44 C 128 78 96 118 122 150 C 146 178 116 204 136 232"
          fill="none" stroke="#5c3a1c" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M88 44 C 128 78 96 118 122 150 C 146 178 116 204 136 232"
          fill="none" stroke="#8a6524" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>
    <path d="M122 150 C 104 168 94 196 92 220"
          fill="none" stroke="#5c3a1c" stroke-width="1.7" stroke-linecap="round"/>

    <use href="#leaf" transform="translate(88,44)   rotate(133) scale(0.82)"/>
    <use href="#leaf" transform="translate(106,70)  rotate(38)  scale(0.68)"/>
    <use href="#leaf" transform="translate(110,98)  rotate(154) scale(0.94)"/>
    <use href="#leaf" transform="translate(111,125) rotate(24)  scale(0.76)"/>
    <use href="#leaf" transform="translate(122,150) rotate(166) scale(0.88)"/>
    <use href="#leaf" transform="translate(131,171) rotate(46)  scale(0.72)"/>
    <use href="#leaf" transform="translate(129,211) rotate(158) scale(0.84)"/>
    <use href="#leaf" transform="translate(105,186) rotate(206) scale(0.66)"/>
    <use href="#leaf" transform="translate(92,220)  rotate(186) scale(0.6)"/>

    <use href="#bud"  transform="translate(136,232) rotate(22)  scale(1.05)"/>
    <use href="#bud"  transform="translate(130,191) rotate(-14) scale(0.62)"/>
    <use href="#berry" transform="translate(118,142)"/>
    <use href="#berry" transform="translate(126,158)"/>
    <use href="#berry" transform="translate(99,214)"/>
  </g>

  <!-- name — fills and fonts inlined so text survives without CSS -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text class="fade"  x="690" y="104" font-size="14" font-weight="700" letter-spacing="7"   fill="#8f3323">&#10022; &#160; OSTINATO RIGORE &#160; &#10022;</text>
    <text class="fade2" x="690" y="170" font-size="56" font-weight="700" letter-spacing="1"   fill="#2b1e08">Roman Yankovych</text>
    <text class="fade3" x="690" y="206" font-size="15" font-weight="700" letter-spacing="6.5" fill="#6b5320">FORWARD DEPLOYED ENGINEER &#183; ELCANO</text>
  </g>

  <!-- shadowed corners -->
  <rect width="1200" height="300" fill="url(#vig)" pointer-events="none"/>

  <!-- gilt frame -->
  <rect x="3"  y="3"  width="1194" height="294" fill="none" stroke="#8a6f3a" stroke-width="2" opacity="0.5"/>
  <rect x="9"  y="9"  width="1182" height="282" fill="none" stroke="url(#frame)" stroke-width="10"/>
  <rect x="9"  y="9"  width="1182" height="282" fill="none" stroke="#fff6d0" stroke-width="1.1" opacity="0.55"/>
  <rect x="17" y="17" width="1166" height="266" fill="none" stroke="#6b5220" stroke-width="1.6"/>
  <rect x="22" y="22" width="1156" height="256" fill="none" stroke="#8a6a1e" stroke-width="1.6" stroke-dasharray="1.5 5" opacity="0.7"/>

  <!-- fleurons seated on the inner rule, top and bottom -->
  <use href="#fleuron" transform="translate(600,22)"/>
  <use href="#fleuron" transform="translate(600,278) rotate(180)"/>
</svg>
