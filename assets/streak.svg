  <text x="140" y="102" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" text-anchor="middle" fill="#f0e4c8">1.8k</text>
  <text x="140" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="1.6" text-anchor="middle" fill="#b8860b">Total Contributions</text>
  <text x="140" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="middle" fill="#8a7350">Oct 22, 2023 — Present</text>
  <circle cx="430" cy="98" r="46" fill="none" stroke="#b8860b" stroke-width="4" opacity="0.25"/>
  <circle cx="430" cy="98" r="46" fill="none" stroke="#e7c469" stroke-width="4" opacity="0.85"/>
  <text x="430" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" text-anchor="middle" fill="#f0e4c8">3</text>
