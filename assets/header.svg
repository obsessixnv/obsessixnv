<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Roman Yankovych — Forward Deployed Engineer at Elcano">
  <title>Roman Yankovych — Forward Deployed Engineer at Elcano · Ostinato Rigore</title>

  <defs>
    <radialGradient id="parch" cx="40%" cy="40%" r="88%">
      <stop offset="0%"  stop-color="#f8edd1"/>
      <stop offset="55%" stop-color="#efdcb2"/>
      <stop offset="100%" stop-color="#ddc28b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8c86c"/>
      <stop offset="45%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8a5a0a"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#f4dd93"/>
      <stop offset="60%" stop-color="#c39320"/>
      <stop offset="100%" stop-color="#7c5108"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="74%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5a3d10" stop-opacity="0.30"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <!-- one petal of a quatrefoil corner ornament -->
    <g id="quat" fill="url(#gold)">
      <circle cx="4" cy="0" r="3.4"/><circle cx="-4" cy="0" r="3.4"/>
      <circle cx="0" cy="4" r="3.4"/><circle cx="0" cy="-4" r="3.4"/>
      <circle r="2" fill="#3a2a14"/>
    </g>
  </defs>

  <style>
    .ttl  { font-family: Georgia, "Times New Roman", serif; fill: #3a2a14; }
    .name { font-size: 56px; font-weight: 700; letter-spacing: 1px; }
    .sub  { font-size: 15px; font-weight: 700; letter-spacing: 6.5px; fill: #6b4423; }
    .motto{ font-size: 14px; font-weight: 700; letter-spacing: 8px; fill: #9c6a12; }
    .fade { animation: fade 1.8s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .glow { animation: glow 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes glow { 0%,100% { opacity: .9; } 50% { opacity: .55; } }
  </style>

  <!-- parchment -->
  <rect width="1200" height="300" fill="url(#parch)"/>
  <rect width="1200" height="300" filter="url(#grain)" opacity="0.55"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- illuminated border -->
  <rect x="16" y="16" width="1168" height="268" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="23" y="23" width="1154" height="254" fill="none" stroke="#b8860b" stroke-width="1" opacity="0.55"/>
  <use href="#quat" x="34" y="34"/>
  <use href="#quat" x="1166" y="34"/>
  <use href="#quat" x="34" y="266"/>
  <use href="#quat" x="1166" y="266"/>

  <!-- celestial sphere (armillary) -->
  <g transform="translate(228,150)">
    <!-- static mounting -->
    <ellipse rx="106" ry="30" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
    <circle r="106" fill="none" stroke="#b8860b" stroke-width="5" stroke-dasharray="1.3 11.5" opacity="0.6"/>
    <circle r="92"  fill="none" stroke="url(#gold)" stroke-width="2"/>
    <line x1="0" y1="-116" x2="0" y2="116" stroke="url(#gold)" stroke-width="1.6"/>
    <circle cx="0" cy="-116" r="3.4" fill="url(#gold)"/>
    <circle cx="0" cy="116"  r="3.4" fill="url(#gold)"/>
    <!-- turning wireframe globe -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="72s" repeatCount="indefinite"/>
      <ellipse rx="86" ry="24" fill="none" stroke="#9c6a12" stroke-width="1.3"/>
      <ellipse rx="86" ry="24" fill="none" stroke="#b8860b" stroke-width="1.3" transform="rotate(60)"/>
      <ellipse rx="86" ry="24" fill="none" stroke="#cf9c2e" stroke-width="1.3" transform="rotate(120)"/>
      <circle cx="86" cy="0" r="3" fill="url(#gold)"/>
    </g>
    <!-- gilt earth at centre -->
    <circle r="9" fill="url(#orb)" stroke="#6b4423" stroke-width="0.6"/>
    <circle class="glow" cx="-3" cy="-3" r="2.4" fill="#fbeec0"/>
  </g>

  <!-- name block -->
  <g class="fade">
    <text class="ttl motto" x="430" y="76">✦ &#160; O S T I N A T O &#160; R I G O R E &#160; ✦</text>
    <text class="ttl name"  x="428" y="158">Roman Yankovych</text>
    <text class="ttl sub"   x="430" y="194">FORWARD DEPLOYED ENGINEER &#183; ELCANO</text>
  </g>

  <!-- laurel flourish -->
  <g transform="translate(600,252)" stroke="none">
    <g id="laurel" fill="url(#gold)">
      <path d="M8 0 Q 60 -5 116 -16" fill="none" stroke="#9c6a12" stroke-width="1.4"/>
      <ellipse cx="22" cy="-2"  rx="9" ry="3.4" transform="rotate(-26 22 -2)"/>
      <ellipse cx="38" cy="-4"  rx="9" ry="3.4" transform="rotate(28 38 -4)"/>
      <ellipse cx="54" cy="-6"  rx="9" ry="3.4" transform="rotate(-26 54 -6)"/>
      <ellipse cx="70" cy="-8"  rx="9" ry="3.4" transform="rotate(28 70 -8)"/>
      <ellipse cx="86" cy="-10" rx="9" ry="3.4" transform="rotate(-26 86 -10)"/>
      <ellipse cx="102" cy="-13" rx="9" ry="3.4" transform="rotate(28 102 -13)"/>
      <ellipse cx="117" cy="-17" rx="7" ry="3"  transform="rotate(-8 117 -17)"/>
    </g>
    <use href="#laurel" transform="scale(-1,1)"/>
    <circle r="3.4" fill="url(#gold)"/>
  </g>
</svg>
