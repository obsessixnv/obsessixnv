<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Festina lente — Ars longa, vita brevis">
  <title>Festina lente · Ars longa, vita brevis</title>
  <defs>
    <radialGradient id="nightf" cx="50%" cy="-10%" r="120%">
      <stop offset="0%"  stop-color="#34230f"/>
      <stop offset="55%" stop-color="#160f09"/>
      <stop offset="100%" stop-color="#0b0807"/>
    </radialGradient>
    <linearGradient id="framef" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#5a3f0e"/>
      <stop offset="50%" stop-color="#e7c469"/>
      <stop offset="100%" stop-color="#5a3f0e"/>
    </linearGradient>
    <linearGradient id="giltf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#e7c469"/>
      <stop offset="60%" stop-color="#9a7320"/>
      <stop offset="100%" stop-color="#4a340b"/>
    </linearGradient>
    <linearGradient id="leafgf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8412a"/>
      <stop offset="55%" stop-color="#79271a"/>
      <stop offset="100%" stop-color="#401410"/>
    </linearGradient>
    <linearGradient id="budgf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a23c28"/>
      <stop offset="100%" stop-color="#5c1c14"/>
    </linearGradient>
    <radialGradient id="vigf" cx="50%" cy="40%" r="78%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grainf">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>

    <g id="leaff">
      <path d="M0 0 C 13 -10 38 -8 47 0 C 38 8 13 10 0 0 Z" fill="url(#leafgf)"/>
      <path d="M4 0 Q 26 1 45 0" fill="none" stroke="#360f0b" stroke-width="0.9"/>
      <path d="M0 0 C 13 -10 38 -8 47 0" fill="none" stroke="#d6a24e" stroke-width="0.8" opacity="0.45"/>
    </g>

    <!-- same carved fleuron as the header, so the frame reads as one set -->
    <g id="fleuronHalff">
      <path d="M5 0 C 20 -1 34 -4 44 0 C 52 4 50 12 43 12 C 37 12 35 5 41 4"
            fill="none" stroke="url(#giltf)" stroke-width="2.4" stroke-linecap="round"/>
      <use href="#leaff" transform="translate(15,-1) rotate(12) scale(0.5)"/>
      <circle cx="27" cy="4.4" r="1.5" fill="#d6a24e" opacity="0.7"/>
      <path d="M56 0 L 132 0" stroke="#8a6a1e" stroke-width="1.4" opacity="0.75"/>
      <path d="M140 0 l 4.4 -3.4 l 4.4 3.4 l -4.4 3.4 Z" fill="#b8912f" opacity="0.85"/>
    </g>
    <g id="fleuronf">
      <use href="#fleuronHalff"/>
      <use href="#fleuronHalff" transform="scale(-1,1)"/>
      <path d="M0 -4 C -6.5 0 -6.5 9 0 14.5 C 6.5 9 6.5 0 0 -4 Z" fill="url(#budgf)"/>
      <path d="M0 12.5 C -2 7 -2 2 0 -2.5" fill="none" stroke="#3a120d" stroke-width="0.8" opacity="0.75"/>
      <path d="M0 -4 C 3.5 0.5 3.5 6 1.5 10" fill="none" stroke="#d6a24e" stroke-width="0.7" opacity="0.45"/>
    </g>
  </defs>

  <rect width="1200" height="150" fill="url(#nightf)"/>
  <rect width="1200" height="150" filter="url(#grainf)" opacity="0.42"/>

  <!-- gilded molding rail -->
  <rect x="34" y="20" width="1132" height="7" fill="url(#framef)"/>
  <rect x="34" y="20" width="1132" height="1.6" fill="#f3e3a6" opacity="0.5"/>
  <line x1="42" y1="36" x2="1158" y2="36" stroke="#8a6a1e" stroke-width="1.6" stroke-dasharray="1.5 5" opacity="0.7"/>

  <!-- carved fleuron seated on the rule -->
  <use href="#fleuronf" transform="translate(600,36)"/>

  <!-- mottos — fills and fonts inlined so text survives without CSS -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <text x="600" y="102" font-size="26" letter-spacing="7" fill="#c0704c">FESTINA LENTE</text>
    <text x="600" y="126" font-size="12" letter-spacing="5" fill="#bda06e">ARS &#183; LONGA &#183; VITA &#183; BREVIS</text>
  </g>

  <rect width="1200" height="150" fill="url(#vigf)" pointer-events="none"/>
</svg>
