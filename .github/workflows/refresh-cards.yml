name: Refresh Codex cards

# Redraws assets/{stats,langs,streak,activity}.svg from the GitHub API and
# commits them when they change. The README points at those files, so it never
# depends on a third-party card service staying up.

on:
  schedule:
    - cron: "17 3 * * *"      # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_cards.py
      - .github/workflows/refresh-cards.yml

concurrency:
  group: refresh-cards
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        env:
          # secrets are readable in a step's env, but not in its `if:` condition
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.METRICS_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::METRICS_TOKEN is not set, so this fell back to GITHUB_TOKEN, which cannot read private contributions — commit counts will be far lower than reality. Create a classic PAT with the read:user scope and save it as the METRICS_TOKEN repository secret."
          fi
          python3 scripts/render_cards.py --user "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Refresh Codex cards"
          git push
