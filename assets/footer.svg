<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Festina lente — Ars longa, vita brevis">
  <title>Festina lente · Ars longa, vita brevis</title>
  <defs>
    <radialGradient id="parchf" cx="50%" cy="8%" r="120%">
      <stop offset="0%"  stop-color="#f5e7c5"/>
      <stop offset="100%" stop-color="#ddc28b"/>
    </radialGradient>
    <linearGradient id="goldf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c86c"/>
      <stop offset="100%" stop-color="#8a5a0a"/>
    </linearGradient>
    <filter id="grainf">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <style>
    .lat { font-family: Georgia, "Times New Roman", serif; fill: #9c6a12; font-weight: 700; }
    .breathe { animation: br 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes br { 0%,100% { transform: scale(1);} 50% { transform: scale(1.035);} }
  </style>

  <rect width="1200" height="150" fill="url(#parchf)"/>
  <rect width="1200" height="150" filter="url(#grainf)" opacity="0.55"/>

  <!-- top rule with fleuron -->
  <line x1="80" y1="34" x2="556" y2="34" stroke="url(#goldf)" stroke-width="1.4"/>
  <line x1="644" y1="34" x2="1120" y2="34" stroke="url(#goldf)" stroke-width="1.4"/>
  <text class="lat breathe" x="600" y="41" text-anchor="middle" font-size="22">&#10087;</text>

  <!-- mottos -->
  <text class="lat" x="600" y="80" text-anchor="middle" font-size="26" letter-spacing="7">FESTINA LENTE</text>
  <text class="lat" x="600" y="102" text-anchor="middle" font-size="12" letter-spacing="5" fill="#6b4423">ARS &#183; LONGA &#183; VITA &#183; BREVIS</text>

  <!-- laurel sprig flourish -->
  <g transform="translate(600,130)">
    <g id="wreath" fill="url(#goldf)">
      <path d="M7 0 Q 46 -4 88 -12" fill="none" stroke="#9c6a12" stroke-width="1.2"/>
      <ellipse cx="18" cy="-2"  rx="7" ry="2.7" transform="rotate(-26 18 -2)"/>
      <ellipse cx="31" cy="-3"  rx="7" ry="2.7" transform="rotate(28 31 -3)"/>
      <ellipse cx="44" cy="-5"  rx="7" ry="2.7" transform="rotate(-26 44 -5)"/>
      <ellipse cx="57" cy="-7"  rx="7" ry="2.7" transform="rotate(28 57 -7)"/>
      <ellipse cx="70" cy="-9"  rx="7" ry="2.7" transform="rotate(-26 70 -9)"/>
      <ellipse cx="84" cy="-12" rx="6" ry="2.5" transform="rotate(-8 84 -12)"/>
    </g>
    <use href="#wreath" transform="scale(-1,1)"/>
    <circle r="2.8" fill="url(#goldf)"/>
  </g>
</svg>
