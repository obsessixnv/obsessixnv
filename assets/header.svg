<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Roman Yankovych — Forward Deployed Engineer at Elcano">
  <title>Roman Yankovych — Forward Deployed Engineer at Elcano · Ostinato Rigore</title>

  <defs>
    <radialGradient id="night" cx="30%" cy="34%" r="98%">
      <stop offset="0%"  stop-color="#3a2716"/>
      <stop offset="42%" stop-color="#1b130c"/>
      <stop offset="100%" stop-color="#0b0807"/>
    </radialGradient>
    <radialGradient id="candle" cx="26%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#6b4824" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#3a2613" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#e7c469"/>
      <stop offset="38%" stop-color="#9a7320"/>
      <stop offset="72%" stop-color="#5a3f0e"/>
      <stop offset="100%" stop-color="#2c1f06"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    <linearGradient id="leafg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8412a"/>
      <stop offset="55%" stop-color="#79271a"/>
      <stop offset="100%" stop-color="#401410"/>
    </linearGradient>
    <linearGradient id="budg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a23c28"/>
      <stop offset="100%" stop-color="#5c1c14"/>
    </linearGradient>
    <radialGradient id="berryg" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#7a241a"/>
      <stop offset="100%" stop-color="#250a08"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>

    <!-- a single dried leaf, base at 0,0 pointing +x -->
    <g id="leaf">
      <path d="M0 0 C 13 -10 38 -8 47 0 C 38 8 13 10 0 0 Z" fill="url(#leafg)"/>
      <path d="M4 0 Q 26 1 45 0" fill="none" stroke="#360f0b" stroke-width="0.9"/>
      <path d="M14 -1 l 6 -5 M24 -1 l 7 -5 M14 1 l 6 5 M24 1 l 7 5" stroke="#360f0b" stroke-width="0.7" opacity="0.7"/>
      <path d="M0 0 C 13 -10 38 -8 47 0" fill="none" stroke="#d6a24e" stroke-width="0.8" opacity="0.45"/>
    </g>
    <!-- nodding rosebud, base at 0,0 -->
    <g id="bud">
      <path d="M0 9 C -11 4 -10 -13 0 -17 C 10 -13 11 4 0 9 Z" fill="url(#budg)"/>
      <path d="M0 -15 C -5 -6 -4 3 0 7" fill="none" stroke="#3a120d" stroke-width="0.9" opacity="0.8"/>
      <path d="M-6 -9 C -4 -2 -3 4 0 7" fill="none" stroke="#3a120d" stroke-width="0.8" opacity="0.7"/>
      <path d="M6 -9 C 4 -2 3 4 0 7" fill="none" stroke="#3a120d" stroke-width="0.8" opacity="0.7"/>
      <path d="M0 -17 C -4 -10 -3 -4 0 0" fill="none" stroke="#d6a24e" stroke-width="0.8" opacity="0.4"/>
      <path d="M-2 8 C -9 14 -13 12 -15 6 M2 8 C 9 14 13 12 15 6" fill="none" stroke="#5a2a16" stroke-width="1.4"/>
    </g>
    <g id="berry">
      <circle r="4.2" fill="url(#berryg)"/>
      <circle cx="-1.3" cy="-1.4" r="1.1" fill="#caa05a" opacity="0.55"/>
    </g>
    <!-- frame crest: rosebud flanked by leaves -->
    <g id="crest">
      <use href="#leaf" transform="translate(-2,0) rotate(168) scale(0.66)"/>
      <use href="#leaf" transform="translate(2,0) rotate(12) scale(0.66)"/>
      <use href="#bud" transform="scale(0.62)"/>
    </g>
  </defs>

  <style>
    .ttl  { font-family: Georgia, "Times New Roman", serif; }
    .name { font-size: 56px; font-weight: 700; letter-spacing: 1px; fill: #ece0c6; }
    .sub  { font-size: 15px; font-weight: 700; letter-spacing: 6.5px; fill: #b89a6a; }
    .motto{ font-size: 14px; font-weight: 700; letter-spacing: 8px; fill: #bd6a48; }
    .fade { animation: fade 2s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .flick { animation: flick 5.5s ease-in-out infinite; }
    @keyframes flick { 0%{opacity:.82} 22%{opacity:1} 38%{opacity:.78} 55%{opacity:.96} 74%{opacity:.8} 100%{opacity:.9} }
  </style>

  <!-- tenebrist ground -->
  <rect width="1200" height="300" fill="url(#night)"/>
  <rect class="flick" width="1200" height="300" fill="url(#candle)"/>
  <rect width="1200" height="300" filter="url(#grain)" opacity="0.5"/>

  <!-- dried botanical, cascading down the left -->
  <g>
    <path d="M96 26 C 150 64 92 150 150 192 C 188 220 176 250 166 264" fill="none" stroke="#4a2a16" stroke-width="2.2"/>
    <path d="M150 192 C 120 206 104 230 96 252" fill="none" stroke="#4a2a16" stroke-width="1.8"/>
    <use href="#leaf" transform="translate(112,64) rotate(118) scale(0.92)"/>
    <use href="#leaf" transform="translate(132,80) rotate(64)  scale(0.66)"/>
    <use href="#leaf" transform="translate(120,104) rotate(28)  scale(1.0)"/>
    <use href="#leaf" transform="translate(112,150) rotate(150) scale(0.96)"/>
    <use href="#leaf" transform="translate(134,168) rotate(18)  scale(0.78)"/>
    <use href="#leaf" transform="translate(104,232) rotate(196) scale(0.86)"/>
    <use href="#leaf" transform="translate(150,196) rotate(54)  scale(1.05)"/>
    <use href="#leaf" transform="translate(140,232) rotate(176) scale(0.9)"/>
    <use href="#leaf" transform="translate(168,236) rotate(126) scale(0.82)"/>
    <use href="#leaf" transform="translate(120,256) rotate(214) scale(0.7)"/>
    <use href="#bud"  transform="translate(180,246) rotate(26)  scale(1.18)"/>
    <use href="#bud"  transform="translate(126,238) rotate(-18) scale(0.7)"/>
    <use href="#berry" transform="translate(152,252)"/>
    <use href="#berry" transform="translate(163,262)"/>
    <use href="#berry" transform="translate(142,248)"/>
  </g>

  <!-- name, lit by candlelight -->
  <g class="fade">
    <text class="ttl motto" x="430" y="78">✦ &#160; O S T I N A T O &#160; R I G O R E &#160; ✦</text>
    <text class="ttl name"  x="428" y="160">Roman Yankovych</text>
    <text class="ttl sub"   x="430" y="196">FORWARD DEPLOYED ENGINEER &#183; ELCANO</text>
  </g>

  <!-- shadow corners -->
  <rect width="1200" height="300" fill="url(#vig)"/>

  <!-- tarnished gilt frame -->
  <rect x="3"  y="3"  width="1194" height="294" fill="none" stroke="#000000" stroke-width="2" opacity="0.6"/>
  <rect x="9"  y="9"  width="1182" height="282" fill="none" stroke="url(#frame)" stroke-width="10"/>
  <rect x="9"  y="9"  width="1182" height="282" fill="none" stroke="#f3e3a6" stroke-width="1.1" opacity="0.4"/>
  <rect x="17" y="17" width="1166" height="266" fill="none" stroke="#1a1206" stroke-width="1.6"/>
  <rect x="22" y="22" width="1156" height="256" fill="none" stroke="#8a6a1e" stroke-width="1.6" stroke-dasharray="1.5 5" opacity="0.7"/>
  <use href="#crest" x="600" y="34"/>
  <use href="#crest" x="600" y="266" transform="rotate(180 600 266)"/>
</svg>
